name: sahay
description: Crisis Response Platform - Your Lifeline in Emergencies
publish_to: 'none'
version: 6.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # WebSocket for real-time chat
  socket_io_client: ^2.0.3+1
  
  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  
  # UI & Animations
  flutter_animate: ^4.5.0
  intl: ^0.18.1
  cached_network_image: ^3.3.0
  
  # Icons
  cupertino_icons: ^1.0.2
  
  # URL Launcher for calls/SMS
  url_launcher: ^6.2.0
  shared_preferences: ^2.5.4
  
  # Firebase packages (compatible versions)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_auth_platform_interface: ^7.4.9
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.6
  
  # Image/Document handling
  image_picker: ^1.1.2
  local_auth: ^2.1.7
  permission_handler: ^12.0.1
  
  # Contact Picker
  flutter_contacts: ^1.1.7+1
  
  # Phone calling
  flutter_phone_direct_caller: ^2.1.1
  
  # Volume button listener
  flutter_volume_controller: ^1.3.2
  
  # Speech to text
  speech_to_text: ^6.6.0
  
  # Audio recording (for Whisper fallback)
  record: ^5.0.4
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.6
  riverpod_generator: ^2.6.1
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  
  # Linting
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
