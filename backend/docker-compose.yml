version: '3.8'

services:
  # PostgreSQL with PostGIS for Users, Auth, and Incidents
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: civicsync_postgres
    environment:
      POSTGRES_USER: civicsync
      POSTGRES_PASSWORD: civicsync_secret_2024
      POSTGRES_DB: civicsync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - civicsync_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicsync -d civicsync"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB for Community Pulse (Twitter-like feed)
  mongodb:
    image: mongo:7.0
    container_name: civicsync_mongodb
    environment:
      MONGO_INITDB_DATABASE: civicsync_community
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - civicsync_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and real-time features (optional but recommended)
  redis:
    image: redis:7-alpine
    container_name: civicsync_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - civicsync_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  civicsync_network:
    driver: bridge
